<div class="relative z-10 flex flex-col justify-between p-xxl h-full">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary-fixed text-display">eco</span>
<h1 class="font-heading text-heading text-primary-fixed font-extrabold tracking-tight">Farmish Orders</h1>
</div>
<div class="max-w-md">
<p class="font-heading text-headline-lg text-surface-bright mb-md">Empowering the Ghanaian food supply chain.</p>
<div class="h-1 w-24 bg-primary-fixed rounded-full"></div>
</div>
</div>
</section>
<!-- Right Side: Interaction Canvas (Login Form) -->
<section class="flex-1 flex flex-col justify-center items-center px-gutter py-xl bg-surface-container-lowest">
<!-- Mobile Brand Header -->
<div class="md:hidden w-full max-w-sm mb-xl flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-primary text-heading">eco</span>
<h1 class="font-heading text-heading text-primary font-extrabold tracking-tight">Farmish Orders</h1>
</div>
<div class="w-full max-w-sm">
<!-- Header -->
<header class="mb-xl">
<h2 class="font-heading text-headline-lg md:text-headline-lg text-primary mb-xs">Welcome back</h2>
<p class="font-body text-body text-muted-leaf">Sign in to manage your sourcing requests.</p>
</header>
<!-- Login Form -->
<form action="#" class="space-y-md" method="POST" onsubmit="return false;">
<div class="space-y-xs">
<label class="font-caption text-caption text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-muted-leaf">mail</span>
<input class="w-full pl-xl py-md pr-md bg-fresh-mist border border-field-border rounded-xl font-body text-body text-on-surface placeholder:text-outline-variant transition-all form-input-focus" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-caption text-caption text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-caption text-caption text-primary hover:underline transition-all" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-muted-leaf">lock</span>
<input class="w-full pl-xl py-md pr-md bg-fresh-mist border border-field-border rounded-xl font-body text-body text-on-surface placeholder:text-outline-variant transition-all form-input-focus" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-muted-leaf hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" id="togglePassword">visibility</span>
</button>
</div>
</div>
<div class="flex items-center gap-xs py-xs">
<input class="w-5 h-5 rounded border-field-border text-primary focus:ring-primary/20 bg-fresh-mist" id="remember" type="checkbox"/>
<label class="font-small text-small text-muted-leaf cursor-pointer" for="remember">Remember for 30 days</label>
</div>
<button class="w-full bg-primary text-on-primary font-heading font-semibold py-md px-lg rounded-full shadow-lg shadow-primary/10 hover:bg-primary-container hover:shadow-primary/20 active:scale-[0.98] transition-all duration-200" type="submit">
                        Sign In
                    </button>
</form>
<!-- Divider -->
<div class="relative my-xl">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-field-border"></div>
</div>
<div class="relative flex justify-center text-caption uppercase">
<span class="bg-surface-container-lowest px-md text-outline-variant font-caption">Or continue with</span>
</div>

<span class="text-small">Google</span>
</button>
<button class="flex items-center justify-center gap-xs py-md px-lg border border-field-border rounded-full font-heading font-semibold text-on-surface hover:bg-fresh-mist transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">ios</span>
<span class="text-small">Apple</span>
</button>

<p class="font-body text-body text-muted-leaf">
                        Don't have an account?

</p>

</main>
<script>
        // Micro-interaction for password toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleBtn.textContent = isPassword ? 'visibility_off' : 'visibility';
        });

        // Atmospheric parallax hint
        document.addEventListener('mousemove', (e) => {
            const image = document.querySelector('section img');
            if (image) {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
                image.style.transform = `scale(1.05) translate(${moveX}px, ${moveY}px)`;
            }
        });
    </script>
